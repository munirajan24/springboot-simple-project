spring.datasource.password=08522580Mcp$m
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Let Hibernate create tables for dev
#spring.jpa.hibernate.ddl-auto=create
#prod or QA(it won't delete any existing data)
spring.jpa.hibernate.ddl-auto=validate
#if we have any problem on updating
#spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Flyway for database migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Optional: change Hibernate dialect (auto-detection normally works)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Server port (optional)
server.port=8082
