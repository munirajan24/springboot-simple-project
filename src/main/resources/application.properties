# MySQL (adjust host, port, user, password)
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/simpledb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
