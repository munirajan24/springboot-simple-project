spring.application.name=springpro

# PostgreSQL connection (local dev)
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/simpledb?sslmode=disable
#Your real Windows host IP is: 172.30.32.1
#To migrate MySQL to Postgres we need to know postgres windows host IP
#To know real host IP win cmd: ip -4 addr show eth0 | grep inet

#spring.datasource.username=postgres
#spring.datasource.password=admin@123
spring.datasource.username=springadmin
spring.datasource.password=08522580Mcp$m
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway: DB already has schema up to V4 ? mark as baseline
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=4
spring.flyway.locations=classpath:db/migration

# avoid built-in SQL init (we rely on Flyway)
spring.sql.init.mode=never

server.port=8082
